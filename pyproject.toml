[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-collab-v3"
version = "0.3.0"
description = "Evolutionary multi-agent collaboration system for the NLP final project"
requires-python = ">=3.9"

[project.scripts]
evo-v3 = "evo.cli:main"

[tool.setuptools.packages.find]
include = ["evo*"]

[tool.setuptools.package-data]
evo = ["web_assets/*"]
